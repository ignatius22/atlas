name: Deploy Atlas to VPS

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Production VPS
    runs-on: ubuntu-latest
    steps:
      - name: Check Secret Availability
        id: check_secrets
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          if [ -z "${VPS_HOST}" ] || [ -z "${VPS_SSH_KEY}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::VPS_HOST or VPS_SSH_KEY secrets are not configured in GitHub repository settings. Skipping deployment."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: SSH into VPS and Run Installer
        if: steps.check_secrets.outputs.configured == 'true'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER || 'root' }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -Eeuo pipefail
            echo "=== Starting Atlas VPS Deployment ==="
            echo "Logged in as: $(whoami)"
            sudo chown -R "$(whoami):$(whoami)" /opt/atlas || true
            sudo chmod -R u+rwX /opt/atlas/.git || true
            git config --global --add safe.directory /opt/atlas
            cd /opt/atlas
            git pull origin main || git pull origin master
            sudo ./scripts/install.sh
            echo "=== Atlas VPS Deployment Complete ==="
