name: Deploy Atlas to VPS

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Production VPS
    runs-on: ubuntu-latest
    steps:
      - name: Check Secret Availability
        id: check_secrets
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          if [ -z "${VPS_HOST}" ] || [ -z "${VPS_SSH_KEY}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::VPS_HOST or VPS_SSH_KEY secrets are not configured in GitHub repository settings. Skipping deployment."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: SSH into VPS and Run Installer
        if: steps.check_secrets.outputs.configured == 'true'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER || 'root' }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          envs: GITHUB_SHA
          script: |
            set -Eeuo pipefail
            echo "=== Starting Atlas VPS Deployment ==="
            echo "Logged in as: $(whoami)"
            sudo chown -R "$(whoami):$(whoami)" /opt/atlas || true
            sudo chmod -R u+rwX /opt/atlas/.git || true
            git config --global --add safe.directory /opt/atlas
            cd /opt/atlas
            # Deploy exactly the commit that triggered this run, from master only.
            # Fast-forward only: if the server has local commits, fail loudly
            # instead of reporting a successful no-op.
            git fetch origin master
            git checkout master
            git merge --ff-only origin/master
            echo "Deployed commit: $(git rev-parse --short HEAD)"
            if [ "$(git rev-parse HEAD)" != "${GITHUB_SHA}" ]; then
              echo "::warning::Server is at $(git rev-parse --short HEAD), expected ${GITHUB_SHA:0:7} (a newer push may have landed)."
            fi
            sudo ./scripts/install.sh
            # Pick up new dashboard code; only restarts if the service is already running.
            if systemctl is-active --quiet atlas-dashboard; then
              sudo systemctl restart atlas-dashboard
              echo "Restarted atlas-dashboard"
            fi
            echo "=== Atlas VPS Deployment Complete ==="
