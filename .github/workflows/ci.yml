name: Atlas CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  matrix-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        pg-version: [14, 15, 16]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y age rclone
          pip install pyyaml

      - name: Run Test Suite
        run: |
          chmod +x bin/atlas bin/doctor scripts/*.sh tests/*.sh
          ./tests/run-all.sh
