name: Atlas CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

# Least privilege: every job gets a read-only token unless it asks for more.
permissions:
  contents: read

# Third-party actions are pinned to full commit SHAs, not tags. A tag can be
# moved to malicious code (as happened with tj-actions/changed-files in 2025);
# a commit SHA cannot. The comment records which release the SHA is.

jobs:
  matrix-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        pg-version: [14, 15, 16]

    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y age rclone
          pip install pyyaml

      - name: Prepare backup directory for end-to-end drills
        run: |
          sudo mkdir -p /var/backups
          sudo chown "$(id -u):$(id -g)" /var/backups

      - name: Run Test Suite
        env:
          PG_VERSION: ${{ matrix.pg-version }}
        run: |
          chmod +x bin/atlas bin/doctor scripts/*.sh tests/*.sh
          ./tests/run-all.sh

  dashboard:
    name: Dashboard (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard/web
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: dashboard/web/package-lock.json

      - name: Install
        run: npm ci

      # Only runtime dependencies ship (in dashboard/dist), so only they gate the
      # build. Dev-tool advisories are reported by the security job instead.
      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      # dashboard/dist is committed so the VPS serves it without Node.js.
      # Fail if someone changed the source but forgot to rebuild.
      - name: Check committed build is up to date
        run: |
          if [ -n "$(git status --porcelain -- ../dist)" ]; then
            echo "::error::dashboard/dist is out of date. Run 'cd dashboard/web && npm run build' and commit the result."
            git status --porcelain -- ../dist
            exit 1
          fi

  security:
    name: Security scans
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      # Atlas is mostly Bash running as root; shellcheck catches the quoting and
      # word-splitting bugs that turn into injection or data loss. shellcheck
      # ships on GitHub's Ubuntu runners.
      # Errors fail the build. Warnings (today: unused variables and dynamic
      # `source` paths) are reported but don't block, until they are cleaned up
      # and this gate is raised to -S warning.
      - name: ShellCheck
        run: |
          shellcheck --version | head -2
          files=(bin/atlas bin/doctor bin/production-preflight get.sh scripts/*.sh scripts/lib/*.sh tests/*.sh)
          shellcheck -S warning -x -f gcc "${files[@]}" || true
          shellcheck -S error -x "${files[@]}"

      # Filesystem scan: known CVEs in lockfiles, committed secrets, and
      # misconfigurations. Fails the build on HIGH/CRITICAL issues that have a fix.
      - name: Trivy (vulnerabilities, secrets, misconfiguration)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

  deploy:
    name: Deploy to Production VPS
    # Deploy only what passed every check, only from master, never from a PR.
    needs: [matrix-test, dashboard, security]
    if: github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    # A GitHub Environment: add required reviewers in Settings > Environments
    # to put a human approval in front of production.
    environment: production
    # Never run two deploys at once, and never cancel one halfway through.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Check deployment secrets
        id: check_secrets
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST_FINGERPRINT: ${{ secrets.VPS_HOST_FINGERPRINT }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          if [ -z "${VPS_HOST}" ] || [ -z "${VPS_SSH_KEY}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::VPS_HOST or VPS_SSH_KEY is not configured. Skipping deployment."
            exit 0
          fi
          # Without a pinned host key the runner trusts whichever machine answers
          # on VPS_HOST, and hands it a root-capable session.
          if [ -z "${VPS_HOST_FINGERPRINT}" ]; then
            echo "::error::VPS_HOST_FINGERPRINT is not set. On the server run: ssh-keygen -lf /etc/ssh/ssh_host_ed25519_key.pub and store the SHA256:... value as a repository secret."
            exit 1
          fi
          if [ -z "${VPS_USER}" ] || [ "${VPS_USER}" = "root" ]; then
            echo "::warning::Deploying as root. Create a dedicated deploy user with limited sudo and set VPS_USER."
          fi
          echo "configured=true" >> "$GITHUB_OUTPUT"

      - name: SSH into VPS and run installer
        if: steps.check_secrets.outputs.configured == 'true'
        uses: appleboy/ssh-action@2ead5e36573f08b82fbfce1504f1a4b05a647c6f # v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER || 'root' }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          fingerprint: ${{ secrets.VPS_HOST_FINGERPRINT }}
          envs: GITHUB_SHA
          script: |
            set -Eeuo pipefail
            echo "=== Atlas deployment of ${GITHUB_SHA:0:7} as $(whoami) ==="
            # /opt/atlas holds code that systemd runs as root, so it stays
            # root-owned: git runs under sudo instead of chown-ing the tree to
            # the deploy user (which would let that user plant code root runs).
            git_root() { sudo git -c safe.directory=/opt/atlas -C /opt/atlas "$@"; }
            git_root fetch --quiet origin master
            # Deploy exactly the commit CI tested. --ff-only refuses if the
            # server has local commits; if the server is already past this
            # commit (a newer deploy won), this is a no-op, never a downgrade.
            git_root merge --ff-only "${GITHUB_SHA}"
            echo "Server now at $(git_root rev-parse --short HEAD)"
            sudo /opt/atlas/scripts/install.sh
            if systemctl is-active --quiet atlas-dashboard; then
              sudo systemctl restart atlas-dashboard
              echo "Restarted atlas-dashboard"
            fi
            # Post-deploy check: a deploy that leaves backups unscheduled has
            # failed, even if every command above succeeded.
            for unit in atlas-backup.timer atlas-drill.timer; do
              if ! systemctl is-enabled --quiet "${unit}"; then
                echo "::error::${unit} is not enabled after deploy."
                exit 1
              fi
            done
            echo "=== Atlas deployment complete ==="
