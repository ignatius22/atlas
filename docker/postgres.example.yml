# ==============================================================================
# Atlas Production Template — Reusable PostgreSQL Service Block
# ==============================================================================
# Copy and adapt this block into your application's docker-compose.prod.yml.
# ==============================================================================

version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: "${APP_NAME:-app}_postgres"
    restart: always
    environment:
      POSTGRES_DB: "${POSTGRES_DB:?POSTGRES_DB is required}"
      POSTGRES_USER: "${POSTGRES_USER:?POSTGRES_USER is required}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}"
    command: >
      postgres
        -c shared_buffers=256MB
        -c effective_cache_size=768MB
        -c work_mem=16MB
        -c maintenance_work_mem=64MB
        -c max_connections=100
    volumes:
      - postgres_data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1024M
        reservations:
          cpus: "0.2"
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - internal_network
    # NOTE: DO NOT expose port 5432 to the host or internet in production!
    # ports:
    #   - "127.0.0.1:5432:5432" # (Uncomment ONLY for local debugging)

volumes:
  postgres_data:
    name: "${APP_NAME:-app}_postgres_data"

networks:
  internal_network:
    name: "${APP_NAME:-app}_network"
    driver: bridge
