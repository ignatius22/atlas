# ==============================================================================
# Atlas Production Template — Security Headers Snippet
# ==============================================================================
# Include in HTTP/HTTPS server blocks:
#   include /etc/nginx/snippets/security-headers.conf;
# ==============================================================================

# HTTP Strict Transport Security (HSTS) — 1 Year duration including subdomains
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

# Prevent MIME type sniffing
add_header X-Content-Type-Options "nosniff" always;

# Prevent Clickjacking (allow embedding only on same origin)
add_header X-Frame-Options "SAMEORIGIN" always;

# Legacy XSS Filter protection
add_header X-XSS-Protection "1; mode=block" always;

# Referrer Policy
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Permissions Policy (Restrict unused browser features by default)
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
