# ==============================================================================
# Atlas Production Template — SSL/TLS Parameters Snippet
# ==============================================================================
# Include in HTTPS server blocks:
#   include /etc/nginx/snippets/ssl-params.conf;
# ==============================================================================

# Restrict to modern, secure protocols (Drop SSLv3, TLS 1.0, TLS 1.1)
ssl_protocols TLSv1.2 TLSv1.3;

# Modern, secure cipher suites with Perfect Forward Secrecy (PFS)
ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
ssl_prefer_server_ciphers on;

# SSL Session Cache & Lifetime
ssl_session_timeout 1d;
ssl_session_cache shared:AtlasSSL:10m;
ssl_session_tickets off;

# OCSP Stapling (Validates certificate revocation without client latency)
ssl_stapling on;
ssl_stapling_verify on;
resolver 1.1.1.1 8.8.8.8 valid=300s ipv6=off;
resolver_timeout 5s;
