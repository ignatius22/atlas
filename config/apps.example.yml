# Atlas app registry. Copy to config/apps.yml, or let `atlas discover --write`
# fill it in from your running containers. Check it with `atlas config validate`.
#
# Each app needs a database, files, or both. Passwords are never stored here:
# Atlas reads them inside each container from the image's standard variables.

apps:
  # A web app with a PostgreSQL database and user uploads
  example-app:
    name: "Example app"
    directory: "/srv/example-app"             # optional; used by the deploy helpers and doctor

    database:
      type: "postgres"                 # postgres, mysql, mariadb or mongodb
      container: "example_db"             # exact container name
      name: "example"                    # database name (MongoDB: optional, all databases by default)
      user: "example"
      backup: true                     # false skips the database
      retention_days: 14               # local copies; never deleted before they are confirmed offsite
      # restore_image: "postgres:16"   # drill image; default is the image the container runs

    files:
      volumes: ["example_uploads"]        # Docker named volumes
      paths: ["/srv/example-app/storage"]     # host folders
      exclude: ["cache", "*.log"]      # matched against names and relative paths
      every_hours: 24                  # minimum hours between files backups
      retention_days: 7

  # A MySQL app with no files
  blog:
    database:
      type: "mysql"
      container: "blog_mysql"
      name: "blog"
      user: "root"                     # root uses MYSQL_ROOT_PASSWORD, others MYSQL_PASSWORD

  # A static site: only files
  docs-site:
    files:
      paths: ["/var/www/docs-site/public"]

  # Optional fields for the deploy helpers (scripts/deploy.sh, rollback.sh, health-check.sh).
  # Not needed for backups.
  example-api:
    directory: "/srv/example-api"
    compose_file: "docker-compose.yml"
    services:
      web:
        container: "example_api_web"
        healthcheck: "http://127.0.0.1:4000/health"
    deployment:
      strategy: "compose"
      branch: "main"
      auto_pull: true
    database:
      type: "mongodb"
      container: "example_api_mongo"
